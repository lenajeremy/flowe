<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Fernary</title>
  <meta name="description"
    content="Fernary builds and runs automated workflows for your business. Describe what you want in plain English and Fernary assembles it, then runs it on a schedule or a webhook — reading and writing your Gmail, Google Calendar, Drive, Docs, Sheets, Slack, Shopify, Stripe and more, pausing for your approval before anything important happens." />

  <meta name="application-name" content="Fernary" />
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Fernary",
      "url": "https://fernary.com/",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web browser",
      "description": "Fernary is a workflow automation application for business. You describe what you want in plain English and Fernary builds the workflow, connects your accounts — Gmail, Google Calendar, Google Drive, Docs and Sheets, Slack, Notion, Linear, GitHub, GitLab, Outlook, Stripe and Shopify — and runs it unattended on a schedule or a webhook, pausing for your approval before consequential actions.",

      "publisher": { "@type": "Organization", "name": "Fernary", "url": "https://fernary.com/" },

    content="Describe an automation in plain English. Fernary builds the workflow, connects your tools, and keeps it running — pausing for your approval before anything important happens." />

    content="Describe an automation in plain English. Fernary builds the workflow, connects your tools, and keeps it running." />

  <style>
    body {
      background: #0a0a0f;
      margin: 0;
    }

    /* Styling for the pre-hydration fallback below. React replaces #root on
         mount, so this is what crawlers, no-JS visitors, and anyone on a slow
         connection see. It says the same things the rendered page says. */
    .boot {
      max-width: 44rem;
      margin: 0 auto;
      padding: 4rem 1.5rem;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #c7d2cd;
      line-height: 1.65;
    }

    .boot h1 {
      color: #fff;
      font-size: 1.9rem;
      letter-spacing: -0.02em;
      margin: 0 0 .35rem;
    }

    .boot h2 {
      color: #fff;
      font-size: 1.05rem;
      margin: 2rem 0 .5rem;
    }

    .boot .tag {
      color: #8a9a94;
      margin: 0 0 1.75rem;
    }

    .boot a {
      color: #3dd68c;
    }

    .boot ul {
      padding-left: 1.2rem;
    }

    .boot li {
      margin: .3rem 0;
    }
  </style>
  <!-- No font CDN, deliberately. Google Sans and Google Sans Code are bundled
         via @fontsource (see src/index.css), so nothing here reaches out — which
         also avoids handing visitor IPs to a third party before the app loads,
         the thing that makes hotlinked Google Fonts a GDPR problem in the EU.
         The JetBrains Mono link that used to live here was dead weight: nothing
         referenced that family. -->
</head>

<body>
  <div id="root">
    <noscript>
      <main class="boot">
        <h1>Fernary</h1>
        <p class="tag">The automation system for AI you can actually leave running.</p>

        <p>
          <strong>Fernary is a web application that builds and runs automated
            workflows for small businesses.</strong> You describe what you want in
          plain English — for example, &ldquo;every weekday at 8am, find orders
          that haven't shipped in three days and draft me an update email for
          each&rdquo; — and Fernary assembles the workflow for you. It then runs
          on a schedule or from a webhook, without you present, and pauses for
          your approval before anything consequential happens.
        </p>

        <h2>Fernary and your Google account</h2>
        <p>
          Fernary requests access to your Google account so the workflows you
          build can carry out their steps on your behalf while you are away.
          Nothing is accessed until you connect an account, and each connection
          is used only for the steps you configured:
        </p>
        <ul>
          <li><strong>Gmail</strong> — Fernary reads and labels the messages a workflow acts on, and sends or drafts the replies that workflow produces, so you can automate a mailbox you would otherwise work through by hand.</li>
          <li><strong>Google Calendar</strong> — Fernary reads the events a workflow reacts to and creates or updates the events it schedules, so an automation can book and reschedule work for you.</li>
          <li><strong>Google Drive, Docs and Sheets</strong> — Fernary reads the files a workflow takes as input and writes the documents, rows and reports it generates, so results land in your own filing rather than inside Fernary.</li>
        </ul>
        <p>
          You can disconnect any account at any time, which stops all further
          access immediately. Fernary does not use your Google data to train AI
          models and does not permit its model providers to do so. What is
          collected, who processes it, and how long it is kept are set out in the
          <a href="/privacy">Privacy Policy</a>.
        </p>

        <h2>Who runs it</h2>
        <p>
          Fernary is operated by Jeremiah Lena, trading as Fernary, based in
          Dublin, Ireland. Contact <a href="mailto:contact@fernary.com">contact@fernary.com</a>.
        </p>

        <p>
          <a href="/privacy">Privacy Policy</a> &middot;
          <a href="/terms">Terms of Service</a> &middot;
          <a href="/login">Sign in</a>
        </p>

        <p class="tag">Loading the application…</p>
      </main>
    </noscript>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
