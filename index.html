<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Fernary</title>
  <meta name="description"
    content="Fernary is the AI that does the work you keep redoing. Describe it once in plain English and Fernary builds the workflow, then runs it on a schedule or a webhook — reading and writing your Gmail, Google Workspace, Slack, Notion, Jira, GitHub, HubSpot, Stripe, Shopify and dozens more, remembering what it already did, and asking before it does anything you would want to sign off on." />
  <link rel="canonical" href="https://fernary.com/" />
  <meta name="robots" content="index, follow" />

  <meta name="application-name" content="Fernary" />
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Fernary",
      "url": "https://fernary.com/",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web browser",
      "description": "Fernary is a workflow automation application for business. You describe what you want in plain English and Fernary builds the workflow, connects your accounts — Gmail, Google Workspace, Outlook, Slack, Notion, Linear, Jira, GitHub, GitLab, Airtable, HubSpot, Stripe, Shopify and dozens more — and runs it unattended on a schedule or a webhook, keeping state between runs and pausing for your approval before consequential actions.",
      "featureList": [
        "Build a workflow by describing it in plain language",
        "Any frontier model per step — Claude, GPT, Gemini, Grok",
        "Read-and-write actions across dozens of business tools",
        "Scheduled and webhook triggers",
        "Human approval steps before consequential actions",
        "Persistent data stores that keep state between runs",
        "Shared team workspaces with per-person usage",
        "Itemised AI usage with no overage billing"
      ],
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" },
      "publisher": { "@type": "Organization", "name": "Fernary", "url": "https://fernary.com/" },
      "privacyPolicy": "https://fernary.com/privacy",
      "termsOfService": "https://fernary.com/terms"
    }
    </script>

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Fernary" />
  <meta property="og:title" content="Fernary — the AI that does the work you keep redoing" />
  <meta property="og:description"
    content="Describe it once. Fernary builds it, runs it on your schedule across the tools you already use, and asks before it does anything you would want to sign off on." />
  <meta property="og:url" content="https://fernary.com/" />
  <meta property="og:image" content="https://fernary.com/fernary-og.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:alt" content="The Fernary wordmark on a dark photograph of unfurling fern fronds." />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@fernaryai" />
  <meta name="twitter:title" content="Fernary — the AI that does the work you keep redoing" />
  <meta name="twitter:description"
    content="Describe it once. Fernary builds it, runs it on your schedule, and asks before it does anything you would want to sign off on." />
  <meta name="twitter:image" content="https://fernary.com/fernary-og.jpg" />

  <style>
    body {
      background: #0a0a0f;
      margin: 0;
    }

  </style>
  <!-- No font CDN, deliberately. Google Sans and Google Sans Code are bundled
         via @fontsource (see src/index.css), so nothing here reaches out — which
         also avoids handing visitor IPs to a third party before the app loads,
         the thing that makes hotlinked Google Fonts a GDPR problem in the EU.
         The JetBrains Mono link that used to live here was dead weight: nothing
         referenced that family. -->
</head>

<body>
  <div id="root"></div>

  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
